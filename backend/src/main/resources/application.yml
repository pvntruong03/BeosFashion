server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: beo-fashion-backend
  datasource:
    url: jdbc:h2:file:./data/beo_fashion_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: BeoFashionHikariPool
      maximum-pool-size: 15
      minimum-idle: 3
      auto-commit: true
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  data:
    enhance-on-startup: false
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash
  password-reset:
    expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:true}
  payment:
    sepay:
      webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.beofashion: INFO
    org.springframework.security: INFO
