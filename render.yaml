services:
  - type: web
    name: beo-fashion-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SEPAY_WEBHOOK_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
